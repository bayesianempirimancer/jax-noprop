model_name: lorenz_vae_flow
main:
  input_shape: 
  - 20
  - 3
  output_shape:
  - 20
  - 3
  latent_shape:
  - 20
  - 3
  recon_loss_type: mse
  recon_weight: 1.0
  reg_weight: 0.0
  use_snr_weight: True
  integration_method: midpoint
  encode_x: false
noise_schedule:
  schedule_type: exponential
  learnable: false
  hidden_dims:
  - 64
  - 64
  default_params:
    alpha_bar_min: 0.01
    alpha_bar_max: 0.99
    s: 0.008
    k: 10.0
    t_mid: 0.5
    beta: 2.0
    loc: 0.5
    scale: 0.1
    power: 2.0
    gamma_range:
    - -4.0
    - 4.0
encoder:
  model_type: mlp
  encoder_type: deterministic
  input_shape:
  - 20
  - 3
  latent_shape:
  - 20
  - 3
  hidden_dims:
  - 64
  - 128
  - 64
  activation: swish
  dropout_rate: 0.0
decoder:
  model_type: mlp
  decoder_type: none
  latent_shape:
  - 20
  - 3
  output_shape:
  - 20
  - 3
  hidden_dims:
  - 64
  - 128
  - 64
  activation: swish
  dropout_rate: 0.0
crn:
  model_type: transformer_seq2seq
  network_type: transformer_seq2seq
  hidden_dims:
  - 128
  - 128
  time_embed_dim: 64
  time_embed_method: sinusoidal
  activation_fn: swish
  use_batch_norm: false
  dropout_rate: 0.1
  num_layers: 4
  num_heads: 8
  mlp_ratio: 4.0

